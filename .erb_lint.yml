---
# CI は bundler-cache で gem を vendor/bundle に置くため、gem 内のテンプレートを除く。
exclude:
  - '**/vendor/**/*'
  - '**/node_modules/**/*'

linters:
  ErbSafety:
    enabled: true
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
