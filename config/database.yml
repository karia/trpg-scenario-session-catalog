# 接続情報は個別の環境変数から組み立てる。CloudNativePG が発行する Secret が
# ホスト・ユーザー・パスワードを別のキーに分けるため、URL への合成を挟まない。
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: trpg_catalog_development

test:
  <<: *default
  database: trpg_catalog_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "trpg_catalog") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("CACHE_DATABASE_NAME", "trpg_catalog_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("QUEUE_DATABASE_NAME", "trpg_catalog_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("CABLE_DATABASE_NAME", "trpg_catalog_cable") %>
    migrations_paths: db/cable_migrate
