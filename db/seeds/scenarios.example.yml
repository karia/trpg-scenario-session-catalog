# db/seeds/scenarios.yml の書式を示すサンプル。実データは git に置かない。
# 投入するときは、このファイルを scenarios.yml にコピーして中身を差し替えるか、
# SCENARIOS_SEED_FILE で別のパスを指す。
- title: 見本シナリオ
  game_systems:
    - 見本システム 1版
    - 見本システム 2版
  authors:
    - 見本作者
    - 共著の見本作者
  player_count_min: 2
  player_count_max: 4
  duration_min_hours: 3
  duration_max_hours: 4
  recommendation: 4
  gm_experienced: true
  character_restriction: HOあり
  character_sheet_deadline: two_days_before
  recommendation_note: GMからのオススメポイントをここに書く。ログインした人にだけ出る。
  purchase_links:
    - label: BOOTH
      url: https://example.com/items/1

# 人数の下限は必須。上限が無いシナリオは player_count_max を空けておく。
- title: 上限のない見本
  game_systems:
    - 見本システム 1版
  authors:
    - 見本作者
  player_count_min: 1
  duration_min_hours: 0.5
  duration_max_hours: 1
  gm_experienced: false
  character_restriction: 制限なし
  # 選択肢に当てはまらない期限は note に原文を残し、選択肢は see_note にする。
  character_sheet_deadline: see_note
  character_sheet_deadline_note: 継続の場合提出不要
  purchase_links:
    # URL を持たない入手先も書ける。
    - label: 書籍購入者限定特典
